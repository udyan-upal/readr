<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>readr</title>
  <link rel="icon" href="../icons/readr.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5EAD8;
      --surface: #F9F4ED;
      --text-primary: #201E1D;
      --text-secondary: #645C50;
      --text-tertiary: #82796A;
      --accent: #C67139;
      --accent-hover: #B2622D;
      --on-accent: #FFF9F2;
      --border: rgba(32, 30, 29, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 240px;
      height: 168px;
      background: var(--bg);
      font-family: 'Figtree', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    #popup-logo {
      width: 88px;
      height: auto;
      display: block;
    }

    #open-btn {
      width: 100%;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
    }

    #open-btn:hover {
      background: var(--accent-hover);
    }

    #open-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <img id="popup-logo" src="../icons/readr-stacked.svg" alt="readr" />
  <button id="open-btn">Open readr</button>
  <span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
