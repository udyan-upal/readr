<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>readr</title>
  <link rel="icon" href="../icons/readr.png" />
  <style>
    :root {
      --bg: #F4ECD8;
      --surface: #FDF6E3;
      --text-primary: #2C1810;
      --text-secondary: #7A6652;
      --text-tertiary: #A0896F;
      --accent: #2C1810;
      --border: #DDD0B8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 240px;
      height: 150px;
      background: var(--bg);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    #popup-logo {
      width: 76px;
      height: auto;
      display: block;
    }

    #open-btn {
      width: 100%;
      background: var(--accent);
      color: var(--surface);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
    }

    #open-btn:hover {
      opacity: 0.82;
    }

    #open-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <img id="popup-logo" src="../icons/readr-nobg.png" alt="readr" />
  <button id="open-btn">Open readr</button>
  <span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
