<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>readr</title>
  <link rel="icon" href="../icons/readr.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <header id="topbar">
    <div id="progress-track"><div id="progress-bar"></div></div>

    <nav id="toolbar">
      <div id="toolbar-left">
        <img id="brand-mark" src="../icons/readr-nobg.png" alt="" />
        <span id="brand-logo">readr</span>
        <span class="toolbar-divider"></span>
        <span id="header-meta"><span id="site-name"></span><span id="read-time"></span></span>
      </div>

      <div id="theme-group" role="group" aria-label="Theme">
        <button class="theme-swatch" data-value="light" aria-label="Light" title="Light"><span class="swatch swatch-light"></span></button>
        <button class="theme-swatch" data-value="sepia" aria-label="Sepia" title="Sepia"><span class="swatch swatch-sepia"></span></button>
        <button class="theme-swatch" data-value="dark" aria-label="Dark" title="Dark"><span class="swatch swatch-dark"></span></button>
      </div>

      <div id="toolbar-right">
        <button class="toolbar-btn" id="btn-read" title="Read aloud">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"></path><path d="M21 16a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2Z"></path><path d="M3 16a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2Z"></path></svg>
          Listen
        </button>
        <button class="toolbar-btn" id="btn-assist" title="tl;dr, chat and notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M15 4v16"></path></svg>
          Assist
        </button>
        <button class="toolbar-btn icon-btn" id="btn-menu" aria-label="More" title="More">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.9"></circle><circle cx="12" cy="12" r="1.9"></circle><circle cx="19" cy="12" r="1.9"></circle></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">
    <div id="loading-state">
      <p>Loading article…</p>
    </div>

    <nav id="toc" aria-label="Table of contents">
      <div id="toc-label">Sections</div>
      <div id="toc-list"></div>
    </nav>

    <div id="article-container" style="display:none">
      <div id="article-meta">
        <span id="byline"></span>
      </div>
      <h1 id="article-title"></h1>
      <div id="article-body"></div>
    </div>

    <div id="error-state" style="display:none">
      <h2>Could not extract article</h2>
      <p id="error-message"></p>
    </div>
  <!-- Assist panel: tl;dr / Ask / Notes -->
  <aside id="assist-panel" aria-label="Assist">
    <div id="assist-header">
      <div id="assist-tabs" role="tablist">
        <button class="assist-tab-btn" id="btn-tldr" role="tab">tl;dr</button>
        <button class="assist-tab-btn" id="btn-chat" role="tab">Ask</button>
        <button class="assist-tab-btn" id="btn-highlights" role="tab">Notes<span id="notes-count"></span></button>
      </div>
      <div class="assist-header-actions">
        <button id="chat-new" type="button" title="Delete this article's chat history and start over">New chat</button>
        <button class="panel-close" id="close-assist" aria-label="Close panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>

    <section class="assist-tab" id="summary-panel" role="tabpanel">
      <div id="summary-body">
        <div id="summary-content">
          <span id="summary-text"></span><span id="summary-cursor">|</span>
        </div>
        <div id="summary-footer">
          <button id="summary-regen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path></svg>
            Regenerate
          </button>
        </div>
      </div>
    </section>

    <section class="assist-tab" id="chat-panel" role="tabpanel">
      <div id="chat-body">
        <div id="chat-messages">
          <div class="chat-empty">Ask about the article or anything else.</div>
        </div>
        <form id="chat-form">
          <textarea id="chat-input" rows="1" placeholder="Ask about this article…"></textarea>
          <button id="chat-send" type="submit" aria-label="Send message" title="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"></path></svg>
          </button>
        </form>
      </div>
    </section>

    <section class="assist-tab" id="highlights-panel" role="tabpanel">
      <div id="highlights-list"></div>
    </section>
  </aside>
  </main>

  <!-- Floating annotation toolbar -->
  <div id="annotation-toolbar">
    <button class="annotation-tool-btn" data-type="highlight">
      <span class="tool-swatch"></span>Highlight
    </button>
    <div class="tool-divider"></div>
    <button class="annotation-tool-btn" data-type="strikethrough">Strike</button>
    <div class="tool-divider"></div>
    <button class="annotation-tool-btn" data-type="comment">Note</button>
    <div class="tool-divider"></div>
    <button class="annotation-tool-btn" data-type="ask">Ask about this</button>
    <div class="tool-divider"></div>
    <button class="annotation-tool-btn" data-type="listen">Listen from here</button>
  </div>

  <!-- Comment input popup -->
  <div id="comment-popup">
    <textarea id="comment-input" placeholder="Add a note…" rows="3"></textarea>
    <div class="comment-actions">
      <button class="comment-btn" id="comment-cancel">Cancel</button>
      <button class="comment-btn primary" id="comment-save">Save</button>
    </div>
  </div>

  <!-- Comment hover tooltip -->
  <div id="annotation-tooltip"></div>
  <div id="read-highlight-pill"></div>

  <!-- More menu -->
  <div id="menu-popover">
    <div class="menu-section">
      <div class="menu-label">Typeface</div>
      <div class="btn-group" id="font-group">
        <button class="option-btn" data-value="inter">Sans</button>
        <button class="option-btn" data-value="georgia">Serif</button>
        <button class="option-btn" data-value="mono">Mono</button>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-label-row">
        <div class="menu-label">Text size</div>
        <div id="size-label"></div>
      </div>
      <input type="range" id="size-range" min="15" max="24" step="0.5" />
    </div>

    <div class="menu-section menu-items">
      <button class="menu-item" id="menu-annotations" type="button">Annotations</button>
      <button class="menu-item" id="btn-info" type="button">Article info</button>
      <a class="menu-item" id="menu-original" href="#" target="_blank" rel="noopener noreferrer">View original page</a>
      <button class="menu-item" id="settings-default" type="button">Back to default</button>
    </div>
  </div>

  <!-- Article info popover -->
  <div id="info-popover">
    <div class="info-row">
      <span class="info-label">Page</span>
      <span class="info-value" id="info-title"></span>
    </div>
    <div class="info-row">
      <span class="info-label">Site</span>
      <span class="info-value" id="info-site"></span>
    </div>
    <div class="info-row">
      <span class="info-label">URL</span>
      <a class="info-value" id="original-url" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <div class="info-row">
      <span class="info-label">Read time</span>
      <span class="info-value" id="info-read-time"></span>
    </div>
    <div class="info-row" id="info-byline-row">
      <span class="info-label">Byline</span>
      <span class="info-value" id="info-byline"></span>
    </div>
  </div>

  <!-- Read aloud pill -->
  <div id="read-player" aria-label="Read aloud controls">
    <button id="read-play-pause" title="Play" aria-label="Play">
      <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z"></path></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.6"></rect><rect x="14" y="5" width="4" height="14" rx="1.6"></rect></svg>
    </button>
    <div id="read-meter">
      <div id="read-progress"><div id="read-progress-fill"></div></div>
      <div id="read-status-row">
        <span id="read-status"></span>
        <span aria-hidden="true">·</span>
        <div id="read-voice-picker">
          <button id="read-voice-toggle" type="button" aria-haspopup="true" aria-expanded="false">
            <span id="read-voice-label">Emma</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
          </button>
          <div id="read-voice-popover" role="group" aria-label="Choose a voice">
            <div class="read-voice-heading">Voice</div>
            <div id="read-voice-group">
              <button class="read-chip" data-voice="ava" type="button">Ava</button>
              <button class="read-chip" data-voice="chris" type="button">Chris</button>
              <button class="read-chip" data-voice="emma" type="button">Emma</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <span class="pill-divider"></span>
    <button id="read-rate-cycle" title="Playback speed">1.25×</button>
    <button id="read-follow" type="button" aria-pressed="true" title="Turn off auto-scroll">Following</button>
    <button id="read-stop" title="Stop" aria-label="Stop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
    <div id="read-error"></div>
  </div>


  <script src="reader.js"></script>
</body>
</html>
