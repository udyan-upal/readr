<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusRead</title>
  <style>
    :root {
      --bg: #F9F7F4;
      --surface: #FFFFFF;
      --text-primary: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-tertiary: #9B9B9B;
      --accent: #1A1A1A;
      --border: #E8E4DF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 240px;
      height: 120px;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
    }

    #open-btn {
      width: 100%;
      background: var(--accent);
      color: var(--surface);
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
      transition: opacity 0.15s;
    }

    #open-btn:hover {
      opacity: 0.82;
    }

    #open-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <button id="open-btn">Open FocusRead</button>
  <span id="status"></span>
  <script src="popup.js"></script>
</body>
</html>
